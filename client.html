<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قسم العباقرة — لغز هيثم</title>
<style>
:root{--teal:#087f73;--ink:#123330;--line:#cfe7e2;--muted:#5b7470}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eaf6f3,#f8fbf9 55%,#e9f3f1);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,#087f73,#0aa292);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:21px}header small{opacity:.85;font-size:13px}
header button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:11px;padding:8px 12px;font-family:inherit;cursor:pointer}
.wrap{max-width:680px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(12,80,72,.07);margin-bottom:14px}
h2{margin:0 0 14px;color:var(--teal);font-size:20px}
label{display:block;font-weight:600;margin:10px 0 5px;font-size:14px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink)}
button.b{width:100%;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px}
button.b:disabled{opacity:.5;cursor:default}
button.o{width:100%;background:#fff;color:var(--teal);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:16px;cursor:pointer;margin-top:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:#fdeceb;color:#b3261e;border-right:4px solid #b3261e;padding:11px;border-radius:9px;margin-top:12px;font-size:14px}
.code{font-size:40px;font-weight:800;letter-spacing:6px;text-align:center;color:var(--teal);direction:ltr;font-family:monospace;background:#eef9f7;border-radius:14px;padding:14px;margin:12px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.p{background:#f7fbfa;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.p b{display:block;font-size:17px}.p small{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#188038;margin-left:5px}
.dot.off{background:#bbb}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:12px}
.score .s{background:#eef9f7;border-radius:14px;padding:12px}.score .s b{display:block;font-size:28px;color:var(--teal)}
.score .vs{font-weight:800;color:var(--muted)}
.timer{height:10px;background:#d8ece8;border-radius:99px;overflow:hidden;margin:12px 0}.timer>span{display:block;height:100%;background:linear-gradient(90deg,#087f73,#0aa292);transition:width .1s linear}
.clock{text-align:center;font-size:28px;font-weight:800;color:var(--teal);direction:ltr}
.q{font-size:21px;font-weight:700;line-height:1.8;margin:14px 0 18px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:right;padding:14px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;font-family:inherit;font-size:17px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--teal);background:#f2faf8}.opt:disabled{cursor:default}
.opt b{background:#e8f4f2;color:var(--teal);border-radius:9px;min-width:32px;height:32px;display:grid;place-items:center}
.opt.ok{background:#e9f7ed;border-color:#7bc47f}.opt.ok b{background:#188038;color:#fff}
.opt.no{background:#fdeceb;border-color:#e57373}.opt.dim{opacity:.45}
.info{background:#eff9f7;border-right:4px solid var(--teal);padding:14px;border-radius:10px;line-height:1.8;margin-top:14px}
.wait{text-align:center;padding:26px 10px;color:var(--muted);line-height:2}
.events{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.9}
.events div{border-bottom:1px dashed var(--line);padding:4px 0}
.badge{display:inline-block;background:#fff3d6;color:#8a5a00;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:480px){.wrap{padding:12px}.q{font-size:19px}.row,.players{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🏆 قسم العباقرة <small>لغز هيثم</small></h1><button onclick="leave()">خروج</button></header>
<div class="wrap">
 <div id="err"></div>
 <div id="setup" class="card"></div>
 <div id="lobby" class="card" style="display:none"></div>
 <div id="game" style="display:none"></div>
 <div id="finish" class="card" style="display:none"></div>
</div>
<footer>سؤال بسؤال · مؤقت بعد القراءة · الخطأ أو فوات الوقت يعيد السؤال للمنافس</footer>
<script>
const SERVER = __SERVER__;
const letters=['أ','ب','ج','د'], digits='٠١٢٣٤٥٦٧٨٩';
const ar=n=>String(n).split('').map(c=>digits[+c]).join('');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pid='',token='',code='',snap=null,busy=false,deadlineAt=0,lastSub='';
try{const sv=JSON.parse(localStorage.getItem('duel_session')||'null');if(sv){pid=sv.pid;token=sv.token;code=sv.code}}catch(e){}
function save(){try{localStorage.setItem('duel_session',JSON.stringify({pid,token,code}))}catch(e){}}
async function api(path,body={}){
 const r=await fetch(SERVER+'/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,pid,token,...body})});
 return await r.json();
}
function showErr(t){document.getElementById('err').innerHTML=t?'<div class="err">'+esc(t)+'</div>':''}
function setup(){
 document.getElementById('setup').style.display='block';
 document.getElementById('lobby').style.display='none';document.getElementById('game').style.display='none';document.getElementById('finish').style.display='none';
 document.getElementById('setup').innerHTML=`
  <h2>منافسة بين لاعبين</h2>
  <p style="color:var(--muted);line-height:1.9;margin:0">أنشئ غرفة وشارك الكود مع منافسك، أو أدخل الكود الذي أرسله لك. كل سؤال يظهر لصاحب الدور فقط: يقرأه، ثم يبدأ مؤقت الإجابة. إن أخطأ أو فات الوقت يعود السؤال للمنافس.</p>
  <label>اسمك</label><input id="name" maxlength="24" placeholder="اكتب اسمك">
  <div class="row" style="margin-top:10px">
   <div><label>عدد الأسئلة</label><select id="rounds"><option value="5">٥</option><option value="10" selected>١٠</option><option value="15">١٥</option><option value="20">٢٠</option></select></div>
   <div><label>وقت الإجابة (ثانية)</label><select id="secs"><option value="10">١٠</option><option value="15" selected>١٥</option><option value="20">٢٠</option><option value="30">٣٠</option></select></div>
  </div>
  <button class="b" id="createBtn" onclick="create()">أنشئ منافسة واحصل على كود</button>
  <label style="margin-top:20px">كود الدعوة</label>
  <input id="joinCode" maxlength="8" placeholder="مثال: HX7K2P" style="text-transform:uppercase;direction:ltr;text-align:center;letter-spacing:4px;font-weight:800">
  <button class="o" id="joinBtn" onclick="join()">انضم إلى المنافسة</button>
  <details style="margin-top:16px"><summary style="cursor:pointer;color:var(--muted);font-size:13px">إعدادات الخادم</summary>
   <label>عنوان الخادم</label><input id="srv" value="${esc(String(SERVER))}" style="direction:ltr;font-size:13px">
   <small style="color:var(--muted)">غيّره فقط إذا نقلت الخادم إلى عنوان آخر؛ ثم أعد تحميل الصفحة.</small></details>`;
}
async function create(){
 if(busy)return;busy=true;showErr('');
 const name=document.getElementById('name').value.trim()||'لاعب';
 const rounds=+document.getElementById('rounds').value,answerSeconds=+document.getElementById('secs').value;
 try{const r=await api('create',{name,rounds,answerSeconds,code:'',pid:'',token:''});
  if(!r.ok){showErr(r.error);return}
  pid=r.pid;token=r.token;code=r.code;save();snap=r;render();
 }catch(e){showErr('تعذر الاتصال بالخادم: '+e.message)}finally{busy=false}
}
async function join(){
 if(busy)return;busy=true;showErr('');
 const c=document.getElementById('joinCode').value.trim();
 const name=document.getElementById('name').value.trim()||'منافس';
 if(!c){showErr('أدخل كود الدعوة.');busy=false;return}
 try{const r=await api('join',{code:c,name,pid:'',token:''});
  if(!r.ok){showErr(r.error);return}
  pid=r.pid;token=r.token;code=r.code;save();snap=r;render();
 }catch(e){showErr('تعذر الاتصال بالخادم: '+e.message)}finally{busy=false}
}
async function act(path,extra={}){
 if(busy)return;busy=true;showErr('');
 try{const r=await api(path,extra);if(!r.ok){showErr(r.error);return}snap=r;syncDeadline();render()}
 catch(e){showErr('تعذر الاتصال: '+e.message)}finally{busy=false}
}
function syncDeadline(){deadlineAt=Date.now()+(snap?.remainingMs||0);lastSub=snap?.sub+'/'+snap?.round+'/'+snap?.phase}
function render(){
 if(!snap){setup();return}
 const S=document.getElementById('setup'),L=document.getElementById('lobby'),G=document.getElementById('game'),F=document.getElementById('finish');
 S.style.display='none';L.style.display='none';G.style.display='none';F.style.display='none';
 if(snap.phase==='lobby'){
  L.style.display='block';
  const ps=snap.players.map(p=>'<div class="p"><b>'+esc(p.name)+(p.isHost?' 👑':'')+'</b><small><span class="dot"></span>'+(p.isHost?'صاحب الغرفة':'المنافس')+'</small></div>').join('');
  L.innerHTML='<h2>غرفة الانتظار</h2><p style="text-align:center;color:var(--muted)">أرسل هذا الكود لمنافسك ليدخل من هاتفه:</p><div class="code">'+esc(snap.code)+'</div>'
   +'<button class="o" onclick="copyCode()">📋 نسخ الكود</button>'
   +'<div class="players">'+ps+'</div>'
   +'<p style="text-align:center;color:var(--muted);margin-top:14px">'+(snap.players.length<2?'⏳ بانتظار دخول المنافس…':'✅ اكتمل اللاعبان')+'</p>'
   +(snap.you.isHost?'<button class="b" onclick="act(\'start\')" '+(snap.players.length<2?'disabled':'')+'>ابدأ المنافسة</button>':'<div class="wait">بانتظار أن يبدأ صاحب الغرفة…</div>');
  return;
 }
 if(snap.phase==='finished'){
  F.style.display='block';const w=snap.winner||{tie:true,name:'تعادل',score:0};
  F.innerHTML='<div style="text-align:center"><div style="font-size:64px">🏆</div><h2>'+(w.tie?'تعادل!':'فاز '+esc(w.name))+'</h2>'
   +'<p style="font-size:19px">'+esc(snap.you.name)+': '+ar(snap.you.score)+' نقطة · '+esc(snap.opponent?.name||'المنافس')+': '+ar(snap.opponent?.score||0)+' نقطة</p>'
   +'<button class="b" onclick="leave()">منافسة جديدة</button></div>';
  return;
 }
 G.style.display='block';renderGame();
}
function copyCode(){navigator.clipboard?.writeText(snap.code);showErr('نُسخ الكود: '+snap.code)}
async function poll(){
 if(!pid||!token||!code)return;
 try{const r=await api('state');if(r.ok){snap=r;const key=r.sub+'/'+r.round+'/'+r.phase;if(key!==lastSub||Math.abs(Date.now()+(r.remainingMs||0)-deadlineAt)>900)syncDeadline();render()}else showErr(r.error)}
 catch(e){/* اتصال مؤقت */}
}
function renderGame(){
 const q=snap.question,you=snap.you,opp=snap.opponent||{name:'المنافس',score:0};
 const total=snap.timerTotalMs||1,left=Math.max(0,deadlineAt-Date.now());
 const pct=Math.min(100,left/total*100);
 let body=`
  <div class="card">
   <div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">السؤال ${ar(snap.round)} من ${ar(snap.total)}</span><span style="color:var(--muted);font-size:13px">${esc(snap.code)}</span></div>
   <div class="score" style="margin-top:12px">
    <div class="s"><small>${esc(you.name)} ${snap.yourTurn?'⭐':''}</small><b>${ar(you.score)}</b></div>
    <div class="vs">⚔</div>
    <div class="s"><small>${esc(opp.name)} ${snap.yourTurn?'':'⭐'}</small><b>${ar(opp.score)}</b></div>
   </div>
   <div style="text-align:center;font-weight:700;color:var(--teal)">${esc(snap.status)}</div>
   <div class="clock" id="clock">${(left/1000).toFixed(1)}</div>
   <div class="timer"><span id="tbar" style="width:${pct}%"></span></div>`;
 if(q){
  body+='<div class="q">'+esc(q.text)+'</div><div class="opts">';
  q.options.forEach((o,i)=>{
   let cls='opt';
   if(snap.sub==='reveal'&&q.correctIndex!==undefined){if(i===q.correctIndex)cls+=' ok';else cls+=' dim'}
   body+='<button class="'+cls+'" '+(snap.sub!=='answering'||!snap.yourTurn?'disabled':'')+' onclick="act(\'answer\',{option:'+i+',qi:'+(snap.round-1)+'})"><b>'+letters[i]+'</b><span>'+esc(o)+'</span></button>';
  });
  body+='</div>';
  if(snap.sub==='reading'&&snap.yourTurn)body+='<button class="b" onclick="act(\'begin\')">قرأت السؤال — ابدأ المؤقت</button>';
  if(snap.sub==='reveal'&&q.explanation)body+='<div class="info">💡 '+esc(q.explanation)+(snap.reveal?.points?' — +'+ar(snap.reveal.points)+' نقطة':'')+'</div>';
 }else{
  body+='<div class="wait">🔒 السؤال الآن عند <b>'+esc(opp.name)+'</b>.<br>إن أخطأ أو فات الوقت سيعود السؤال إليك بوقتك الكامل.</div>';
 }
 body+='<div class="events">'+snap.events.map(e=>'<div>• '+esc(e)+'</div>').join('')+'</div></div>';
 document.getElementById('game').innerHTML=body;
}
function tick(){
 const c=document.getElementById('clock'),b=document.getElementById('tbar');
 if(!c||!snap)return;
 const left=Math.max(0,deadlineAt-Date.now()),total=snap.timerTotalMs||1;
 c.textContent=(left/1000).toFixed(1);if(b)b.style.width=Math.min(100,left/total*100)+'%';
}
function leave(){pid='';token='';code='';snap=null;try{localStorage.removeItem('duel_session')}catch(e){}showErr('');setup()}
setup();if(pid&&token&&code){poll().then(()=>{if(snap)syncDeadline()})}
setInterval(poll,700);setInterval(tick,100);
</script></body></html>
